name = "ourhostself-ourtunnelself"
main = "src/worker.js"
compatibility_date = "2026-11-26"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[durable_objects.bindings]]
name = "OURHOSTSELF_STATE"
class_name = "OURHOSTSELFState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OURHOSTSELFState"]

# Configure secrets with Wrangler; never commit private keys.
# OSOS_SEAT_PUBLIC_KEY_PEM
# OSOS_PORTAL_PUBLIC_KEY_PEM
# OURHOSTSELF_SEAT_ISSUER
# OURHOSTSELF_PORTAL_ISSUER
# OURHOSTSELF_SEAT_AUDIENCE (optional)
# OURHOSTSELF_PORTAL_AUDIENCE (optional)