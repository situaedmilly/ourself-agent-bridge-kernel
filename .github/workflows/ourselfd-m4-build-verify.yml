name: OURSELFd M4 Build Verify

on:
  push:
    branches:
      - main
      - "ourselfd/**"
  pull_request:

jobs:
  build-verify-bounded-birth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Verify
        run: npm test

      - name: Bounded runtime birth
        run: node runtime/ourselfd/m4-bounded-runtime.js
