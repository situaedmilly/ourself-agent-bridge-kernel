name: OURSELF Cursor Morph
run-name: OURSELF Cursor Morph / ${{ github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ourself-cursor-morph.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cursor-materialization:
    name: Cursor Materialization
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Emit cursor birth
        run: |
          echo "CURSOR=WORKFLOW_RUN"
          echo "JOB=$GITHUB_JOB"
          echo "RUN_ID=$GITHUB_RUN_ID"
          echo "RUNNER=$RUNNER_NAME"
          echo "CURSOR_MORPH=WORKFLOW_RUN->JOB->RUNNER"
