name: Bridge Security Regression
on:
  pull_request:
    paths:
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - "tools/**"
      - "agents/**"
      - "test/**"
      - ".github/workflows/bridge-security-regression.yml"
  push:
    branches:
      - main
    paths:
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - "tools/**"
      - "agents/**"
      - "test/**"
      - ".github/workflows/bridge-security-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-regression:
    name: Security Regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - name: Install locked dependencies
        run: npm ci
      - name: Run security regression harness
        run: npm test

      - name: Emit OURSELF execution receipt
        run: |
          mkdir -p evidence
          cat > evidence/ourself-actions-receipt.json <<'EOF'
          {
            "schema": "OURSELF_GITHUB_ACTIONS_EXECUTION_RECEIPT_V0.1",
            "claim": "BOUNDED_INSTITUTIONAL_RUNTIME_BIRTH",
            "workflow": "Bridge Security Regression",
            "surface": "GitHub Actions",
            "boundary": "runner_is_not_target_machine",
            "verification": "run_job_step_log_artifact_observable"
          }
          EOF
          cat evidence/ourself-actions-receipt.json
      - name: Upload OURSELF execution receipt
        uses: actions/upload-artifact@v4
        with:
          name: ourself-actions-execution-receipt
          path: evidence/ourself-actions-receipt.json
