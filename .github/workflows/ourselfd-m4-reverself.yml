name: OURSELFd M4 REVERSELF Execution

on:
  push:
    branches:
      - "ourselfd/m4-build-verify-bounded-birth"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reverself:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: node runtime/ourselfd/m4-bounded-runtime.js
